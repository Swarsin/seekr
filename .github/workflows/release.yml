name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Target package index"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: success() && github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: >
      success() && (
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
      )
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Extract changelog section
        run: |
          python3 - <<'EOF'
          import os
          import re
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.removeprefix("v")
          heading_re = re.compile(rf"^## \[{re.escape(version)}\](?:\s+-\s+.*|\s*)$")
          next_section_re = re.compile(r"^(?:##\s+|\[[^\]]+\]:\s+https?://)")

          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          in_section = False
          collected: list[str] = []
          for line in lines:
              if not in_section:
                  if heading_re.match(line):
                      in_section = True
                  continue
              if next_section_re.match(line):
                  break
              collected.append(line)

          body = "\n".join(collected).strip()
          if not in_section or not body:
              raise SystemExit(f"CHANGELOG.md has no non-empty section for {version!r}")

          Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          EOF
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "seekr $GITHUB_REF_NAME" \
            --notes-file release-notes.md
