name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,torch]"
      - run: ruff check .
      - run: pytest -m "not slow"

  minimal:
    # Default install only (ONNX Runtime, no PyTorch): the suite must pass
    # without the torch extra.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel
      - run: |
          python -m venv /tmp/m
          /tmp/m/bin/pip install dist/*.whl pytest hypothesis
          /tmp/m/bin/python -c "import importlib.util as u, sys; sys.exit(any(u.find_spec(m) for m in ('torch', 'sentence_transformers')))"
          /tmp/m/bin/python -m pytest -m "not slow"

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          version="$(/tmp/v/bin/seekr --version)"
          echo "$version"
          test "$version" = "seekr 0.1.1"
          /tmp/v/bin/seekr doctor --env-only

  slow:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,torch]"
      - id: hf-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/seekr/config.py', 'src/seekr/provision.py') }}
      - if: steps.hf-cache.outputs.cache-hit != 'true'
        run: |
          seekr models pull --rerank --yes
          python -c 'from sentence_transformers import SentenceTransformer; SentenceTransformer("BAAI/bge-small-en-v1.5")'
          python -c 'from sentence_transformers import CrossEncoder; CrossEncoder("cross-encoder/ms-marco-MiniLM-L-6-v2")'
      - run: pytest -m slow
