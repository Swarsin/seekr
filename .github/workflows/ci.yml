name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # PyTorch is large and slow to install; the default backend is ONNX. The
      # torch-dependent tests skip themselves when sentence-transformers is
      # absent, so only Linux installs it.
      - if: runner.os == 'Linux'
        run: pip install -e ".[dev,torch]"
      - if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: ruff check .
      - run: pytest -m "not slow"

  minimal:
    # Default install only (ONNX Runtime, no PyTorch): the suite must pass
    # without the torch extra.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "VENV=$RUNNER_TEMP/m" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then echo "BIN=Scripts" >> "$GITHUB_ENV"; else echo "BIN=bin" >> "$GITHUB_ENV"; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel
      - run: |
          python -m venv "$VENV"
          "$VENV/$BIN/python" -m pip install dist/*.whl pytest hypothesis
          "$VENV/$BIN/python" -c "import importlib.util as u, sys; sys.exit(any(u.find_spec(m) for m in ('torch', 'sentence_transformers')))"
          "$VENV/$BIN/python" -m pytest -m "not slow"

  wheel:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "VENV=$RUNNER_TEMP/v" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then echo "BIN=Scripts" >> "$GITHUB_ENV"; else echo "BIN=bin" >> "$GITHUB_ENV"; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - run: |
          python -m venv "$VENV"
          "$VENV/$BIN/python" -m pip install dist/*.whl
          expected="seekr $(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          version="$("$VENV/$BIN/seekr" --version | tr -d '\r')"
          echo "$version"
          test "$version" = "$expected"
          "$VENV/$BIN/seekr" doctor --env-only

  slow:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - if: runner.os == 'Linux'
        run: pip install -e ".[dev,torch]"
      - id: hf-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('src/seekr/config.py', 'src/seekr/provision.py') }}
      - if: steps.hf-cache.outputs.cache-hit != 'true'
        run: seekr models pull --rerank --yes
      - if: runner.os == 'Linux' && steps.hf-cache.outputs.cache-hit != 'true'
        run: |
          python -c 'from sentence_transformers import SentenceTransformer; SentenceTransformer("BAAI/bge-small-en-v1.5")'
          python -c 'from sentence_transformers import CrossEncoder; CrossEncoder("cross-encoder/ms-marco-MiniLM-L-6-v2")'
      - run: pytest -m slow
